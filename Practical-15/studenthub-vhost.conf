# ========================================================
# Apache Virtual Host Configuration for StudentHub Portal
# File: Practical-15/studenthub-vhost.conf
#
# Deployment Instructions:
# 1. Open C:\Windows\System32\drivers\etc\hosts (as Administrator)
#    Add the following line:
#    127.0.0.1    studenthub.local
#    127.0.0.1    www.studenthub.local
#
# 2. Open C:\xampp\sstudenthub\apache\conf\extra\httpd-vhosts.conf
#    Append the configuration block below OR include this file using:
#    Include "C:/xampp/sStudentHub/htdocs/StudentHub/Practical-15/studenthub-vhost.conf"
#
# 3. Ensure 'NameVirtualHost *:80' is enabled in httpd.conf or httpd-vhosts.conf.
#
# 4. Restart Apache in the XAMPP Control Panel.
#
# 5. Access the portal in browser at:
#    http://studenthub.local/
# ========================================================

<VirtualHost *:80>
    ServerAdmin webmaster@studenthub.local
    DocumentRoot "C:/xampp/sStudentHub/htdocs/StudentHub"
    ServerName studenthub.local
    ServerAlias www.studenthub.local

    <Directory "C:/xampp/sStudentHub/htdocs/StudentHub">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Custom Logging
    ErrorLog "C:/xampp/sStudentHub/apache/logs/studenthub_error.log"
    CustomLog "C:/xampp/sStudentHub/apache/logs/studenthub_access.log" combined

    # Security Headers
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>
</VirtualHost>

# Fallback localhost definition so default localhost:80 continues to function seamlessly
<VirtualHost *:80>
    DocumentRoot "C:/xampp/sStudentHub/htdocs"
    ServerName localhost
    <Directory "C:/xampp/sStudentHub/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
